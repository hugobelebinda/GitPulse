server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: omnidoc-ingestion
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://omnidoc:omnidoc_dev_password@localhost:27017/omnidoc?authSource=admin}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:omnidoc}
    password: ${RABBITMQ_DEFAULT_PASS:omnidoc_dev_password}

omnidoc:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:omnidoc}
    secret-key: ${MINIO_ROOT_PASSWORD:omnidoc_dev_password}
    bucket: ${MINIO_BUCKET:omnidoc-documents}
  messaging:
    queue: ${RABBITMQ_QUEUE:document-processing-queue}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.omnidoc: INFO
