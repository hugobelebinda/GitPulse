name: gitpulse

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitpulse-postgres
    environment:
      POSTGRES_DB: gitpulse
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitpulse_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse -d gitpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: gitpulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gitpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gitpulse_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    build: .
    image: gitpulse:0.1.0
    container_name: gitpulse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gitpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gitpulse_dev_password}
      MINIO_BUCKET: gitpulse-raw
      MINIO_SECURE: "false"
    entrypoint: ["python", "-c", "from etl.minio_client import ensure_bucket; print(ensure_bucket())"]
    restart: "no"

  api:
    build: .
    image: gitpulse:0.1.0
    container_name: gitpulse-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://gitpulse:${POSTGRES_PASSWORD:-gitpulse_dev_password}@postgres:5432/gitpulse
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gitpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gitpulse_dev_password}
      MINIO_BUCKET: gitpulse-raw
      MINIO_SECURE: "false"
      GITPULSE_DATA_DIR: /app/data
      GITPULSE_RESULTS_PATH: /app/ds/results.json
    ports:
      - "8000:8000"
    volumes:
      - ./ds:/app/ds
      - ./data:/app/data
      - ./web:/app/web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: gitpulse:0.1.0
    container_name: gitpulse-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://gitpulse:${POSTGRES_PASSWORD:-gitpulse_dev_password}@postgres:5432/gitpulse
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gitpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gitpulse_dev_password}
      MINIO_BUCKET: gitpulse-raw
      MINIO_SECURE: "false"
      GITPULSE_DATA_DIR: /app/data
      GITPULSE_RESULTS_PATH: /app/ds/results.json
    volumes:
      - ./ds:/app/ds
      - ./data:/app/data
      - ./etl:/app/etl
      - ./gitpulse:/app/gitpulse
      - ./tests:/app/tests
    profiles: ["jobs"]
    command: ["python", "-m", "etl.clickhouse_backfill", "--days", "180"]

  jupyter:
    image: gitpulse:0.1.0
    container_name: gitpulse-jupyter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://gitpulse:${POSTGRES_PASSWORD:-gitpulse_dev_password}@postgres:5432/gitpulse
      GITPULSE_DATA_DIR: /app/data
      GITPULSE_RESULTS_PATH: /app/ds/results.json
    ports:
      - "8888:8888"
    volumes:
      - ./ds:/app/ds
      - ./data:/app/data
      - ./gitpulse:/app/gitpulse
      - ./etl:/app/etl
    profiles: ["notebook"]
    command:
      [
        "jupyter",
        "lab",
        "--ip=0.0.0.0",
        "--port=8888",
        "--no-browser",
        "--allow-root",
        "--NotebookApp.token=",
        "--NotebookApp.password=",
      ]

  scheduler:
    image: gitpulse:0.1.0
    container_name: gitpulse-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://gitpulse:${POSTGRES_PASSWORD:-gitpulse_dev_password}@postgres:5432/gitpulse
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gitpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gitpulse_dev_password}
      MINIO_BUCKET: gitpulse-raw
      MINIO_SECURE: "false"
      GITPULSE_DATA_DIR: /app/data
      GITPULSE_RESULTS_PATH: /app/ds/results.json
      GITPULSE_REFRESH_INTERVAL_SECONDS: ${GITPULSE_REFRESH_INTERVAL_SECONDS:-86400}
      GITPULSE_BACKFILL_DAYS: ${GITPULSE_BACKFILL_DAYS:-14}
      GITPULSE_HOLDOUT_DAYS: ${GITPULSE_HOLDOUT_DAYS:-30}
    volumes:
      - ./ds:/app/ds
      - ./data:/app/data
      - ./etl:/app/etl
      - ./gitpulse:/app/gitpulse
      - ./scripts:/app/scripts
    profiles: ["schedule"]
    entrypoint: ["/bin/bash", "/app/scripts/scheduler.sh"]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
